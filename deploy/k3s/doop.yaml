apiVersion: v1
kind: Service
metadata:
  name: doop
  namespace: doop
spec:
  type: ClusterIP
  selector:
    app: doop
  ports:
    - port: 4400
      targetPort: 4400
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doop
  namespace: doop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doop
  template:
    metadata:
      labels:
        app: doop
    spec:
      containers:
        - name: doop
          image: ghcr.io/bryann2k/doop:bryan-main
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: doop-secrets
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: doop-secrets
                  key: BETTER_AUTH_SECRET
            - name: BETTER_AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: doop-secrets
                  key: BETTER_AUTH_URL
            - name: SIGNUP_EMAIL_DOMAINS
              valueFrom:
                secretKeyRef:
                  name: doop-secrets
                  key: SIGNUP_EMAIL_DOMAINS
          ports:
            - containerPort: 4400
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4400
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4400
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
